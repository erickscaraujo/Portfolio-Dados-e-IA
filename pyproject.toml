[project]
name = "portfolio-dados"
version = "1.0.0"
description = "Portfolio de projetos em analise de dados, BI, ciencia de dados, governanca, ML, IA e engenharia"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "outputs", "dados_brutos"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle erros
    "W",   # pycodestyle avisos
    "F",   # pyflakes
    "I",   # ordenacao de imports (isort)
    "N",   # nomes pep8
    "UP",  # sintaxe moderna
    "B",   # armadilhas comuns (bugbear)
    "C4",  # comprehensions melhores
    "SIM", # simplificacoes
]

[tool.ruff.lint.per-file-ignores]
# Field() como default de argumento e padrao idiomatico no FastAPI
"**/api_modelo/app.py" = ["B008"]
# X / X_tr sao convencao universal em ciencia de dados para matrizes de features
"**/previsao_churn_telecom/main.py" = ["N803"]
"**/api_modelo_credito/treinar.py" = ["N806"]
"**/chatbot_intencoes/classificador.py" = ["N806"]
"**/inferencia_batch_score/main.py" = ["N806"]
"**/treino_experimentos_registry/treinar.py" = ["N806"]
"**/canary_deploy_modelo/main.py" = ["N806"]
"**/calibracao_probabilidades/main.py" = ["N806"]
"**/propensao_cross_sell/main.py" = ["N806"]
"**/classes_desbalanceadas_estrategias/main.py" = ["N803", "N806"]
"**/validacao_cruzada_comparada/main.py" = ["N803"]
"**/curvas_aprendizado_diagnostico/main.py" = ["N803", "N806"]
"**/importancia_features_comparada/main.py" = ["N803"]
"**/drift_multivariado_classificador/main.py" = ["N806"]
# corpus de FAQ: textos longos de proposito, quebrar as frases atrapalharia a leitura
"**/busca_semantica_documentos/main.py" = ["E501"]
"**/rag_respostas_citadas/main.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
